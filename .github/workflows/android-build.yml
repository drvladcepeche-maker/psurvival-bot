name: Android Worker build

on:
  push:
    branches:
      - feature/game-screen-ocr
      - feature/game-screen-classifier
      - fix/android-arrayadapter-refresh-20261128
      - fix/telegram-advanced-worker-steps-20261128
  pull_request:
    branches:
      - main
      - fix/android-arrayadapter-refresh-20261128

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download Russian OCR data
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fL --retry 3 --connect-timeout 30 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/rus.traineddata \
            -o app/src/main/assets/tessdata/rus.traineddata
          echo "e16e5e036cce1d9ec2b00063cf8b54472625b9e14d893a169e2b0dedeb4df225  app/src/main/assets/tessdata/rus.traineddata" | sha256sum --check -

      - name: Assemble debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: psurvival-worker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

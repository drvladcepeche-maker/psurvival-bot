name: Validate Telegram bot

on:
  push:
    branches: [main, fix/game-automation-and-bridge, fix/overlay-touch-recorder]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/telegram-bot/index.ts
          deno check supabase/functions/psurvival-worker/index.ts
      - name: Test webhook secret validation
        run: deno test supabase/functions/telegram-bot/tests/
      - name: Syntax-check vendored Termux bridge
        run: |
          node --check termux-bridge/bridge.mjs
          node --check termux-bridge/apk-inspect.mjs
      - name: Verify worker endpoint rejects unauthenticated calls
        run: |
          node --input-type=module <<'NODE'
          const url = "https://xevqbgjtxuveeqaiacvm.supabase.co/functions/v1/psurvival-worker";
          const health = await fetch(url);
          if (!health.ok) throw new Error(`Worker health endpoint returned HTTP ${health.status}`);
          const status = await health.json();
          if (status.ok !== true || status.service !== "psurvival-worker" || status.configured !== true) {
            throw new Error("Worker endpoint is not configured");
          }
          const unauthorized = await fetch(url, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ action: "claim" }),
          });
          if (unauthorized.status !== 401) {
            throw new Error(`Worker endpoint should reject missing token with HTTP 401, got ${unauthorized.status}`);
          }
          console.log("Worker endpoint health and unauthenticated-request rejection verified.");
          NODE
      - name: Register and verify deployed Telegram webhook
        run: |
          node --input-type=module <<'NODE'
          const url = "https://xevqbgjtxuveeqaiacvm.supabase.co/functions/v1/telegram-bot";
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Health endpoint returned HTTP ${response.status}`);
          const data = await response.json();
          if (data.ok !== true || data.service !== "telegram-bot") {
            throw new Error("Unexpected health endpoint response");
          }
          console.log(`Telegram webhook status: ${String(data.status)}`);
          if (typeof data.diagnostic === "string" && data.diagnostic) console.log(`Telegram diagnostic: ${data.diagnostic}`);
          if (data.configured !== true) throw new Error("Telegram secrets are missing");
          if (data.webhookRegistered !== true) {
            throw new Error(`Telegram webhook is not verified (status: ${String(data.status)})`);
          }
          console.log("Telegram webhook registration verified.");
          NODE

  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android worker APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: psurvival-worker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Validate Telegram bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Function
        run: deno check supabase/functions/telegram-bot/index.ts
      - name: Test webhook secret validation
        run: deno test supabase/functions/telegram-bot/tests/webhook_secret_test.ts
      - name: Smoke-test deployed function health endpoint
        run: |
          node --input-type=module <<'NODE'
          const url = "https://xevqbgjtxuveeqaiacvm.supabase.co/functions/v1/telegram-bot";
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Health endpoint returned HTTP ${response.status}`);
          const data = await response.json();
          if (data.ok !== true || data.service !== "telegram-bot") {
            throw new Error("Unexpected health endpoint response");
          }
          console.log(`Function reachable; secrets configured: ${Boolean(data.configured)}`);
          if (!data.configured) console.warn("::warning::Telegram secrets are not configured; webhook cannot be activated yet.");
          NODE

name: Validate Telegram bot

on:
  push:
    branches: [main, fix/game-automation-and-bridge, feature/sherlock-telegram-integration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/telegram-bot/index.ts
          deno check supabase/functions/psurvival-worker/index.ts
          deno check supabase/functions/sherlock-worker-gateway/index.ts
          deno check supabase/functions/termux-bridge/index.ts
      - name: Test webhook secret validation
        run: deno test supabase/functions/telegram-bot/tests/
      - name: Syntax-check Python workers and Termux bridge
        run: python -m py_compile sherlock-worker/worker.py termux-bridge/bridge.py
      - name: Syntax-check vendored Termux bridge
        run: |
          node --check termux-bridge/bridge.mjs
          node --check termux-bridge/apk-inspect.mjs
      - name: Verify worker endpoint rejects unauthenticated calls
        run: |
          node --input-type=module <<'NODE'
          const url = "https://xevqbgjtxuveeqaiacvm.supabase.co/functions/v1/psurvival-worker";
          const health = await fetch(url);
          if (!health.ok) throw new Error(`Worker health endpoint returned HTTP ${health.status}`);
          const status = await health.json();
          if (status.ok !== true || status.service !== "psurvival-worker" || status.configured !== true) {
            throw new Error("Worker endpoint is not configured");
          }
          const unauthorized = await fetch(url, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ action: "claim" }),
          });
          if (unauthorized.status !== 401) {
            throw new Error(`Worker endpoint should reject missing token with HTTP 401, got ${unauthorized.status}`);
          }
          console.log("Worker endpoint health and unauthenticated-request rejection verified.");
          NODE
      - name: Verify chat archive API CORS and unauthenticated rejection
        run: |
          node --input-type=module <<'NODE'
          const url = "https://tscsenfbbogsnipqgrfm.supabase.co/functions/v1/chat-archive-api";
          const allowedOrigin = "https://osiris.prekrasnoeblizko.ru";
          const allowed = await fetch(url, {
            method: "OPTIONS",
            headers: {
              "Origin": allowedOrigin,
              "Access-Control-Request-Method": "POST",
              "Access-Control-Request-Headers": "authorization,content-type",
            },
          });
          if (allowed.status !== 204) {
            throw new Error(`Allowed CORS preflight should return 204, got ${allowed.status}`);
          }
          const denied = await fetch(url, {
            method: "OPTIONS",
            headers: {
              "Origin": "https://smoke-test.invalid",
              "Access-Control-Request-Method": "POST",
              "Access-Control-Request-Headers": "authorization,content-type",
            },
          });
          if (denied.status !== 403) {
            throw new Error(`Disallowed CORS preflight should return 403, got ${denied.status}`);
          }
          const unauthorized = await fetch(url, {
            method: "POST",
            headers: { "Origin": allowedOrigin, "content-type": "application/json" },
            body: JSON.stringify({ action: "get_settings" }),
          });
          if (unauthorized.status !== 401) {
            throw new Error(`Chat archive API should reject missing bearer token with HTTP 401, got ${unauthorized.status}`);
          }
          console.log("Chat archive CORS allow/deny and missing-token rejection verified.");
          NODE
      - name: Verify Graphify machine endpoints reject missing and malformed credentials
        run: |
          node --input-type=module <<'NODE'
          const endpoints = [
            {
              name: "Graphify Memory MCP",
              url: "https://tscsenfbbogsnipqgrfm.supabase.co/functions/v1/graphify-memory-mcp",
              body: { jsonrpc: "2.0", id: 1, method: "tools/list", params: {} },
            },
            {
              name: "Graphify Artifact Upload",
              url: "https://tscsenfbbogsnipqgrfm.supabase.co/functions/v1/graphify-artifact-upload",
              body: { project_id: "contacts" },
            },
          ];
          for (const endpoint of endpoints) {
            for (const authorization of [undefined, "Bearer invalid-smoke-test-token"]) {
              const headers = { "content-type": "application/json" };
              if (authorization) headers.authorization = authorization;
              const response = await fetch(endpoint.url, {
                method: "POST",
                headers,
                body: JSON.stringify(endpoint.body),
              });
              if (response.status !== 401) {
                throw new Error(`${endpoint.name} should reject unauthenticated/malformed credentials with HTTP 401, got ${response.status}`);
              }
            }
          }
          console.log("Both Graphify machine endpoints reject missing and malformed credentials.");
          NODE
  deployed-smoke:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Register and verify deployed Telegram webhook
        run: |
          node --input-type=module <<'NODE'
          const url = "https://xevqbgjtxuveeqaiacvm.supabase.co/functions/v1/telegram-bot";
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Health endpoint returned HTTP ${response.status}`);
          const data = await response.json();
          if (data.ok !== true || data.service !== "telegram-bot") {
            throw new Error("Unexpected health endpoint response");
          }
          console.log(`Telegram webhook status: ${String(data.status)}`);
          if (data.configured !== true) throw new Error("Telegram secrets are missing");
          if (data.webhookRegistered !== true) {
            throw new Error(`Telegram webhook is not verified (status: ${String(data.status)})`);
          }
          console.log("Telegram webhook registration verified.");
          NODE

  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android worker APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: psurvival-worker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
